<svg xmlns="http://www.w3.org/2000/svg" viewBox="280 180 420 510" width="100%" height="100%">
  <defs>
    <!-- Clip path to keep internal bag fills bounded to the bag body -->
    <clipPath id="bagSquareClip">
      <rect x="322" y="328" width="338" height="337" rx="4" />
    </clipPath>
  </defs>

  

  <!-- 0. OPTIONAL CONTINUOUS WHITE DIE-CUT STICKER OUTLINE -->
  

  <!-- 1. BAG HANDLE (ORANGE ARCH) -->
  <path
    d="M 394,328 C 394,206 588,206 588,328"
    fill="none"
    stroke="#ff6e00"
    stroke-width="16"
    stroke-linecap="round"
  />

  <!-- 2. BAG BODY & DYNAMIC SPEED ACCENTS -->
  <g clip-path="url(#bagSquareClip)">
    <!-- Base Orange Surface -->
    <rect x="322" y="328" width="338" height="337" fill="#ff6e00" />

    <!-- Top-Left Corner Cutout: Pure transparent/white background cutout -->
    <path
      d="M 322,328 L 416,328 C 378,350 346,386 322,442 Z"
      fill="#ffffff"
    />

    <!-- Top-Left Dynamic White Speed Swoosh -->
    <path
      d="M 416,328 C 378,350 346,386 322,442 L 322,504 C 356,440 408,382 478,328 Z"
      fill="#ffffff"
    />

    <!-- Bottom-Right 3D Gusset Fold (Orange + Amber Shadow) -->
    <polygon points="566,665 660,571 660,665" fill="#ff6e00" />
    <polygon points="616,665 660,571 660,665" fill="#ea8500" />

    <!-- Bottom-Right Dynamic White Speed Stripe -->
    <polygon points="506,665 540,665 660,545 660,511" fill="#ffffff" />
  </g>

  <!-- External Extensions of the Speed Ribbons (breaking the square boundary like in 90224.svg) -->
  <!-- Top-left outer tip -->
  <path
    d="M 322,442 C 322,442 320,432 322,426 L 322,442 Z"
    fill="#ffffff"
  />
  <!-- Bottom-right outer tip -->
  <polygon points="504,665 542,665 538,667 504,667" fill="#ffffff" />

  <!-- 3. THE ICONIC EXPRESSIVE KAWAII FACE -->
  <!-- Left Eye: Solid Black Oval Tilted -8 degrees -->
  <ellipse
    cx="406"
    cy="476"
    rx="21"
    ry="29"
    fill="#000000"
    transform="rotate(-8 406 476)"
  />

  <!-- Right Eye: Exact 90224 Stylized Dynamic Wink with Eyelash Wing -->
  <!-- Solid single black glyph combining the curved eyelid, upper flick, and outer sweep -->
  <path
    d="M 488,498
       C 502,460 534,440 568,442
       L 602,398
       C 584,432 566,450 554,460
       C 568,452 590,452 608,466
       C 608,466 596,478 578,474
       C 544,466 516,482 488,498
       Z"
    fill="#000000"
  />

  <!-- Wide Mischievous Smile: Joyful upward curve into the wink -->
  <path
    d="M 398,552 C 438,602 532,602 602,492"
    fill="none"
    stroke="#000000"
    stroke-width="22"
    stroke-linecap="round"
  />
</svg>