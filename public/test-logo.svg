    <!-- Clip path for the bag body so corner accents remain perfectly inside -->
    <clipPath id="bagClip">
      <rect x="640" y="160" width="190" height="190" rx="2" />
    </clipPath>
  </defs>

  <!-- ========================================== -->
  <!-- 1. BIG SPEED "G" (Pure Black #000000)      -->
  <!-- ========================================== -->
  <g fill="#000000">
