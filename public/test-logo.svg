        M 45,138
        L 165,138
        C 210,105 285,105 340,140
        C 378,165 400,202 400,245
        L 255,245
        L 255,295
        L 348,295
        C 338,340 298,368 245,368
        C 180,368 132,320 132,250
        C 132,228 138,208 148,190
        L 45,190
        L 105,164
        Z
      "
