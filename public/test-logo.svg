    />
    <!-- Refined top wing & body connection for exact curvature -->
    <path
      d="
        M 45,138
        L 180,138
        C 225,104 290,104 345,142
        C 382,168 402,204 402,245
        L 402,350
        L 345,350
        L 345,295
        L 255,295
        L 255,245
        L 402,245
        C 402,200 375,160 338,138
        C 285,105 210,105 165,138
        L 45,138
        L 108,164
        L 45,190
        L 125,190
        C 105,215 95,245 95,280
        C 95,355 155,415 240,415
        C 320,415 385,365 400,295
        L 402,390
        C 365,430 305,455 240,455
        C 130,455 42,370 42,260
        C 42,230 48,202 60,178
        Z
